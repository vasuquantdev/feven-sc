[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = ".tools/solc-0.8.26.exe"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "v4-core/=lib/v4-core/src/"
]

[fmt]
line_length = 120
